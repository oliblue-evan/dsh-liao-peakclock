<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title">
  <title id="title">Peak Countdown model button and Beijing time timeline</title>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#F9FAFE"/><stop offset="1" stop-color="#EBEFF9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1B2140" flood-opacity=".09"/></filter>
  </defs>
  <rect width="640" height="300" rx="18" fill="url(#background)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,sans-serif">
    <text x="42" y="120" font-size="26" font-weight="600" fill="#151922">Peak Countdown</text>
    <text x="42" y="157" font-size="13" fill="#5B6274">See the current window and</text>
    <text x="42" y="178" font-size="13" fill="#5B6274">time left by the model name.</text>
    <rect x="278" y="50" width="320" height="200" rx="16" fill="#FFF" filter="url(#shadow)"/>
    <rect x="301" y="74" width="274" height="38" rx="8" fill="#F0F2FA"/>
    <text x="316" y="98" font-size="14" fill="#252C3C">DS4.1F <tspan fill="#237460">· 谷 12:47</tspan><tspan fill="#5B6274"> · High</tspan></text>
    <path d="m553 91 4 4 4-4" stroke="#5B6274" stroke-width="1.5" fill="none"/>
    <text x="312" y="146" font-size="11" fill="#5B6274">20:13 Beijing time</text>
    <text x="564" y="146" text-anchor="end" font-size="11" fill="#5B6274">Next window · Tomorrow 09:00</text>
    <rect x="312" y="165" width="252" height="8" rx="4" fill="#6BAF9C"/>
    <path d="M406.5 169h31.5m21 0h42" stroke="#C79761" stroke-width="8"/>
    <path d="M524.3 159v20" stroke="#252C3C" stroke-width="2"/>
    <g font-size="10" fill="#5B6274">
      <text x="312" y="194">00:00</text><text x="438" y="194" text-anchor="middle">12:00</text><text x="564" y="194" text-anchor="end">24:00</text>
      <circle cx="316" cy="222" r="4" fill="#6BAF9C"/><text x="326" y="226">Off-peak (谷)</text>
      <circle cx="408" cy="222" r="4" fill="#C79761"/><text x="418" y="226">Peak (峰)</text>
    </g>
  </g>
</svg>
